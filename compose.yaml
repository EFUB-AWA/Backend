
services:
  postgres:
    image: postgres:17-alpine
    container_name: irion-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?DB name required}
      POSTGRES_USER: ${POSTGRES_USER:?DB user required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?DB password required}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine
    container_name: irion-redis
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
